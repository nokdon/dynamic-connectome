[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-connectome"
version = "0.1.0"
description = "Controlled experiments in learned sparse routing and hybrid spiking models"
readme = "README.md"
license-files = ["THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = ["jax==0.9.2", "numpy==2.4.4", "optax==0.2.8", "networkx==3.6.1"]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]
plots = ["matplotlib==3.10.8"]

[project.scripts]
dc = "dynamic_connectome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dynamic_connectome = ["_artifacts/*.json", "_artifacts/*.npz", "_artifacts/models/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
